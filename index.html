/* ============================================================
   AI/ML/DL Atlas — Dark Premium Theme (ported from reference)
   ============================================================ */

.atlas-root {
  --bg: #080a0f;
  --bg-2: #0b0f16;
  --panel: #0f141c;
  --panel-2: #141b25;
  --panel-3: #18212d;
  --text: #f4f7fb;
  --muted: #9aa7b8;
  --soft: #c7d2e0;
  --border: #253041;
  --border-strong: #334155;
  --cyan: #22d3ee;
  --green: #34d399;
  --amber: #fbbf24;
  --rose: #fb7185;
  --violet: #a78bfa;
  --shadow: 0 24px 80px rgba(0, 0, 0, 0.38);

  min-height: 100vh;
  color-scheme: dark;
  background:
    linear-gradient(rgba(37, 48, 65, 0.28) 1px, transparent 1px),
    linear-gradient(90deg, rgba(37, 48, 65, 0.22) 1px, transparent 1px),
    linear-gradient(135deg, #080a0f, #0a0d13 38%, #101019 62%, #080a0f);
  background-size: 44px 44px, 44px 44px, auto;
  color: var(--text);
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
    "Segoe UI", sans-serif;
}

.atlas-root * {
  box-sizing: border-box;
}

.atlas-root html {
  scroll-behavior: smooth;
}

.atlas-root a {
  color: inherit;
  text-decoration: none;
}

.atlas-root button {
  color: inherit;
  font: inherit;
}

.atlas-root img {
  display: block;
  max-width: 100%;
}

.atlas-root .app-shell {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* ---------- Top bar ---------- */
.atlas-root .topbar {
  position: sticky;
  top: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 18px;
  padding: 14px 28px;
  border-bottom: 1px solid rgba(148, 163, 184, 0.16);
  background: #080a0fe0;
  -webkit-backdrop-filter: blur(18px);
  backdrop-filter: blur(18px);
}

.atlas-root .brand {
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 210px;
}

.atlas-root .brand-mark,
.atlas-root .page-hero-icon {
  display: grid;
  place-items: center;
  border: 1px solid rgba(34, 211, 238, 0.42);
  background: #0b1720;
  color: var(--cyan);
}

.atlas-root .brand-mark {
  width: 38px;
  height: 38px;
  border-radius: 8px;
}

.atlas-root .brand strong,
.atlas-root .brand small {
  display: block;
}

.atlas-root .brand strong {
  font-size: 0.95rem;
}

.atlas-root .brand small {
  color: var(--muted);
  font-size: 0.78rem;
  margin-top: 2px;
}

.atlas-root .nav-links {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  flex: 1;
}

.atlas-root .nav-links a,
.atlas-root .icon-link,
.atlas-root .secondary-action,
.atlas-root .primary-action,
.atlas-root .inline-action,
.atlas-root .card-actions a,
.atlas-root .filter-row button {
  min-height: 38px;
  border-radius: 8px;
  transition: border-color 0.16s ease, background 0.16s ease, color 0.16s ease,
    transform 0.16s ease;
}

.atlas-root .nav-links a {
  padding: 9px 12px;
  color: var(--muted);
  font-size: 0.9rem;
  cursor: pointer;
}

.atlas-root .nav-links a:hover,
.atlas-root .nav-links a.active {
  background: #22d3ee17;
  color: var(--text);
}

.atlas-root .icon-link,
.atlas-root .primary-action,
.atlas-root .secondary-action,
.atlas-root .inline-action,
.atlas-root .card-actions a {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}

.atlas-root .icon-link {
  padding: 9px 12px;
  border: 1px solid var(--border);
  color: var(--soft);
  cursor: pointer;
  background: transparent;
}

.atlas-root .icon-link:hover,
.atlas-root .secondary-action:hover,
.atlas-root .inline-action:hover,
.atlas-root .card-actions a:hover {
  border-color: #22d3ee94;
  color: var(--text);
}

.atlas-root main {
  overflow: hidden;
  flex: 1;
}

/* ---------- Layout bands ---------- */
.atlas-root .hero-grid,
.atlas-root .page-hero,
.atlas-root .content-band,
.atlas-root .split-section,
.atlas-root .media-band,
.atlas-root .catalog-toolbar,
.atlas-root .stat-strip {
  width: min(1180px, calc(100% - 40px));
  margin-inline: auto;
}

/* ---------- Hero ---------- */
.atlas-root .hero-grid {
  display: grid;
  grid-template-columns: minmax(0, 0.9fr) minmax(420px, 1.1fr);
  gap: 28px;
  min-height: 620px;
  align-items: center;
  padding: 58px 0 36px;
}

.atlas-root .hero-copy h1,
.atlas-root .page-hero h1 {
  margin: 0;
  max-width: 760px;
  font-size: 4.25rem;
  line-height: 0.95;
  letter-spacing: -0.02em;
}

.atlas-root .hero-copy p:not(.eyebrow),
.atlas-root .page-hero p:not(.eyebrow),
.atlas-root .section-copy p,
.atlas-root .framework-card p,
.atlas-root .usecase-card p,
.atlas-root .agent-card p,
.atlas-root .category-card p {
  color: var(--soft);
  line-height: 1.7;
}

.atlas-root .hero-copy p:not(.eyebrow),
.atlas-root .page-hero p:not(.eyebrow) {
  max-width: 670px;
  font-size: 1.05rem;
}

.atlas-root .eyebrow {
  margin: 0 0 12px;
  color: var(--green);
  font-size: 0.78rem;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.08em;
}

.atlas-root .hero-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  margin-top: 28px;
}

.atlas-root .primary-action,
.atlas-root .secondary-action {
  padding: 11px 16px;
  border: 1px solid transparent;
  font-weight: 800;
  cursor: pointer;
}

.atlas-root .primary-action {
  background: var(--text);
  color: #081014;
}

.atlas-root .primary-action:hover {
  transform: translateY(-1px);
}

.atlas-root .secondary-action {
  border-color: var(--border);
  background: #0f141cb8;
  color: var(--soft);
}

/* ---------- Graph stage ---------- */
.atlas-root .graph-stage {
  position: relative;
  min-height: 475px;
  overflow: hidden;
  border: 1px solid var(--border);
  border-radius: 8px;
  background:
    linear-gradient(rgba(96, 165, 250, 0.09) 1px, transparent 1px),
    linear-gradient(90deg, rgba(52, 211, 153, 0.08) 1px, transparent 1px),
    linear-gradient(140deg, #0c1119, #121821 52%, #10141c);
  background-size: 34px 34px, 34px 34px, auto;
  box-shadow: var(--shadow);
}

.atlas-root .edge-layer {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}

.atlas-root .graph-edge {
  fill: none;
  stroke: #60a5fa94;
  stroke-width: 0.42;
  stroke-dasharray: 9 9;
  animation: edge-flow 7s linear infinite;
}

.atlas-root .edge-two { stroke: #34d39994; animation-delay: -1.5s; }
.atlas-root .edge-three { stroke: #fbbf2499; animation-delay: -2.4s; }
.atlas-root .edge-four { stroke: #fb718594; animation-delay: -3.1s; }
.atlas-root .edge-five { stroke: #a78bfa8c; animation-delay: -4.3s; }

@keyframes edge-flow {
  to {
    stroke-dashoffset: -90;
  }
}

.atlas-root .graph-node {
  position: absolute;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  min-width: 130px;
  padding: 10px 12px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: #080a0fdb;
  color: var(--text);
  font-size: 0.86rem;
  font-weight: 800;
  transform: translate(-50%, -50%);
  box-shadow: 0 16px 40px #00000047;
  cursor: pointer;
}

.atlas-root .graph-node span {
  width: 10px;
  height: 10px;
  border-radius: 999px;
  background: currentColor;
  box-shadow: 0 0 24px currentColor;
}

.atlas-root .tone-cyan { color: var(--cyan); }
.atlas-root .tone-green { color: var(--green); }
.atlas-root .tone-amber { color: var(--amber); }
.atlas-root .tone-rose { color: var(--rose); }
.atlas-root .tone-violet { color: var(--violet); }

.atlas-root .graph-node:hover {
  border-color: currentColor;
  background: #141b25f5;
}

.atlas-root .graph-console {
  position: absolute;
  right: 18px;
  bottom: 18px;
  display: grid;
  gap: 2px;
  min-width: 190px;
  padding: 14px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: #080a0fe0;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}

.atlas-root .graph-console span,
.atlas-root .graph-console small {
  color: var(--muted);
  font-size: 0.78rem;
}

.atlas-root .graph-console strong {
  color: var(--green);
  font-size: 1.15rem;
}

/* ---------- Stat strip ---------- */
.atlas-root .stat-strip {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 12px;
  margin-top: 8px;
}

.atlas-root .stat-tile,
.atlas-root .agent-card,
.atlas-root .usecase-card,
.atlas-root .category-card,
.atlas-root .framework-card,
.atlas-root .metadata-panel,
.atlas-root .detail-aside,
.atlas-root .explain-panel,
.atlas-root .search-panel {
  border: 1px solid var(--border);
  border-radius: 8px;
  background: #0f141cc7;
}

.atlas-root .stat-tile {
  display: grid;
  gap: 6px;
  padding: 18px;
}

.atlas-root .stat-tile svg {
  color: var(--cyan);
}

.atlas-root .stat-tile strong {
  font-size: 2rem;
}

.atlas-root .stat-tile span {
  color: var(--muted);
  font-size: 0.88rem;
}

/* ---------- Sections ---------- */
.atlas-root .split-section,
.atlas-root .media-band,
.atlas-root .content-band {
  padding: 72px 0 0;
}

.atlas-root .split-section {
  display: grid;
  grid-template-columns: minmax(0, 0.88fr) minmax(360px, 1.12fr);
  gap: 28px;
  align-items: start;
}

.atlas-root .section-copy h2,
.atlas-root .section-header h2,
.atlas-root .detail-main h2,
.atlas-root .detail-aside h2 {
  margin: 0 0 12px;
  font-size: 2rem;
  line-height: 1.15;
  letter-spacing: -0.01em;
}

.atlas-root .inline-action {
  color: var(--cyan);
  font-weight: 800;
  cursor: pointer;
}

.atlas-root .content-band {
  padding-top: 56px;
}

/* ---------- Cards / grids ---------- */
.atlas-root .section-header {
  display: flex;
  align-items: end;
  justify-content: space-between;
  gap: 18px;
  margin-bottom: 18px;
}

.atlas-root .card-grid,
.atlas-root .usecase-grid,
.atlas-root .category-grid {
  display: grid;
  gap: 14px;
}

.atlas-root .card-grid {
  grid-template-columns: repeat(3, minmax(0, 1fr));
}

.atlas-root .usecase-grid,
.atlas-root .category-grid {
  grid-template-columns: repeat(4, minmax(0, 1fr));
}

.atlas-root .agent-card,
.atlas-root .usecase-card,
.atlas-root .category-card,
.atlas-root .framework-card {
  display: flex;
  flex-direction: column;
  min-height: 230px;
  padding: 18px;
}

.atlas-root .agent-card:hover,
.atlas-root .usecase-card:hover,
.atlas-root .category-card:hover,
.atlas-root .framework-card:hover {
  border-color: #22d3ee70;
  background: #141b25e6;
  transform: translateY(-2px);
}

.atlas-root .card-topline {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 14px;
}

.atlas-root .card-topline small {
  color: var(--muted);
  font-size: 0.78rem;
}

.atlas-root .framework-pill,
.atlas-root .tag-list span {
  display: inline-flex;
  align-items: center;
  min-height: 26px;
  padding: 4px 8px;
  border: 1px solid rgba(34, 211, 238, 0.34);
  border-radius: 999px;
  background: #22d3ee1f;
  color: var(--cyan);
  font-size: 0.75rem;
  font-weight: 800;
}

.atlas-root .framework-pill.cyan { background: #22d3ee24; color: var(--cyan); border-color: #22d3ee57; }
.atlas-root .framework-pill.green { background: #34d39924; color: var(--green); border-color: #34d39957; }
.atlas-root .framework-pill.amber { background: #fbbf2424; color: var(--amber); border-color: #fbbf2457; }
.atlas-root .framework-pill.rose { background: #fb718524; color: var(--rose); border-color: #fb718557; }
.atlas-root .framework-pill.violet { background: #a78bfa24; color: var(--violet); border-color: #a78bfa57; }

.atlas-root .agent-card h3,
.atlas-root .usecase-card h3,
.atlas-root .category-card h3,
.atlas-root .framework-card strong {
  margin: 0;
  color: var(--text);
  line-height: 1.25;
  font-size: 1.05rem;
}

.atlas-root .category-card strong {
  margin: 0;
  color: var(--text);
  line-height: 1.25;
  font-size: 1.1rem;
  display: block;
}

.atlas-root .agent-card p,
.atlas-root .usecase-card p,
.atlas-root .category-card p,
.atlas-root .framework-card p {
  margin: 10px 0 14px;
  font-size: 0.92rem;
}

.atlas-root .tag-list,
.atlas-root .card-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: auto;
}

.atlas-root .tag-list span {
  border-color: var(--border);
  background: #94a3b81a;
  color: var(--soft);
}

.atlas-root .card-actions a {
  flex: 1;
  padding: 8px 10px;
  border: 1px solid var(--border);
  color: var(--soft);
  font-size: 0.86rem;
  cursor: pointer;
  background: transparent;
}

.atlas-root .framework-card span {
  color: var(--muted);
  line-height: 1.6;
  font-size: 0.85rem;
}

/* ---------- Page hero (sub-pages) ---------- */
.atlas-root .page-hero {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 120px;
  gap: 24px;
  align-items: center;
  padding: 66px 0 28px;
}

.atlas-root .page-hero-icon {
  width: 112px;
  height: 112px;
  border-radius: 8px;
}

/* ---------- Catalog toolbar ---------- */
.atlas-root .catalog-toolbar {
  display: grid;
  grid-template-columns: minmax(240px, 0.9fr) minmax(0, 1.1fr);
  gap: 12px;
  padding-top: 18px;
}

.atlas-root .filter-row {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
  overflow-x: auto;
  padding: 6px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: #0f141cbd;
}

.atlas-root .filter-row svg {
  flex: 0 0 auto;
  color: var(--muted);
  margin-left: 6px;
}

.atlas-root .filter-row button {
  flex: 0 0 auto;
  border: 1px solid transparent;
  background: transparent;
  color: var(--muted);
  cursor: pointer;
  padding: 8px 11px;
  white-space: nowrap;
}

.atlas-root .filter-row button:hover,
.atlas-root .filter-row button.active {
  border-color: #22d3ee70;
  background: #22d3ee14;
  color: var(--text);
}

.atlas-root .catalog-count {
  margin-bottom: 14px;
  color: var(--muted);
  font-size: 0.9rem;
}

/* ---------- Search panel ---------- */
.atlas-root .search-panel {
  padding: 14px;
  box-shadow: var(--shadow);
}

.atlas-root .search-panel.compact {
  width: 100%;
  margin: 0;
  box-shadow: none;
}

.atlas-root .search-box {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  min-height: 48px;
  padding: 0 14px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: #080a0fb8;
  color: var(--muted);
}

.atlas-root .search-box input {
  width: 100%;
  min-width: 0;
  border: 0;
  outline: 0;
  background: transparent;
  color: var(--text);
  font: inherit;
}

.atlas-root .search-results {
  display: grid;
  gap: 8px;
  margin-top: 12px;
}

.atlas-root .result-row {
  display: grid;
  grid-template-columns: 10px minmax(0, 0.7fr) minmax(0, 1fr);
  gap: 10px;
  align-items: center;
  padding: 10px;
  border-radius: 8px;
  color: var(--soft);
  cursor: pointer;
}

.atlas-root .result-row:hover {
  background: #34d39914;
}

.atlas-root .result-row strong,
.atlas-root .result-row small {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.atlas-root .result-row small {
  color: var(--muted);
}

.atlas-root .mini-dot {
  width: 10px;
  height: 10px;
  border-radius: 999px;
  background: var(--cyan);
}

.atlas-root .mini-dot.cyan { background: var(--cyan); }
.atlas-root .mini-dot.green { background: var(--green); }
.atlas-root .mini-dot.amber { background: var(--amber); }
.atlas-root .mini-dot.rose { background: var(--rose); }
.atlas-root .mini-dot.violet { background: var(--violet); }

/* ---------- Detail layout ---------- */
.atlas-root .detail-layout {
  display: grid;
  grid-template-columns: minmax(280px, 0.34fr) minmax(0, 0.66fr);
  gap: 18px;
  width: min(1180px, calc(100% - 40px));
  margin: 26px auto 0;
  align-items: start;
  padding-bottom: 56px;
}

.atlas-root .detail-aside {
  position: sticky;
  top: 88px;
  display: grid;
  gap: 18px;
  padding: 18px;
}

.atlas-root .detail-main {
  display: grid;
  gap: 18px;
  min-width: 0;
}

.atlas-root .metadata-panel {
  display: grid;
  gap: 10px;
  padding: 16px;
}

.atlas-root .metadata-panel h2,
.atlas-root .detail-aside h2 {
  margin: 0;
  font-size: 1rem;
}

.atlas-root .meta-row {
  display: grid;
  grid-template-columns: minmax(80px, 0.38fr) minmax(0, 0.62fr);
  gap: 10px;
  padding-top: 8px;
  border-top: 1px solid rgba(148, 163, 184, 0.16);
}

.atlas-root .meta-row span {
  color: var(--muted);
}

.atlas-root .meta-row strong {
  min-width: 0;
  overflow-wrap: anywhere;
  font-size: 0.92rem;
}

.atlas-root .check-list {
  display: grid;
  gap: 10px;
  padding: 0;
  margin: 0;
  list-style: none;
}

.atlas-root .check-list li {
  display: grid;
  grid-template-columns: 18px minmax(0, 1fr);
  gap: 9px;
  color: var(--soft);
  line-height: 1.55;
  font-size: 0.92rem;
}

.atlas-root .check-list svg {
  color: var(--green);
  margin-top: 3px;
}

.atlas-root .flow-trace {
  display: grid;
  gap: 8px;
}

.atlas-root .flow-step {
  display: grid;
  grid-template-columns: 32px minmax(0, 1fr);
  gap: 10px;
  align-items: center;
  padding: 10px;
  border: 1px solid rgba(148, 163, 184, 0.16);
  border-radius: 8px;
  background: #080a0f80;
}

.atlas-root .flow-step span {
  display: grid;
  place-items: center;
  width: 28px;
  height: 28px;
  border-radius: 999px;
  background: #22d3ee24;
  color: var(--cyan);
  font-weight: 900;
}

.atlas-root .flow-step strong {
  font-size: 0.92rem;
}

.atlas-root .explain-panel,
.atlas-root .related-band {
  padding: 20px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: #0f141ca8;
}

.atlas-root .explain-panel h2 {
  margin: 0 0 12px;
  font-size: 1.4rem;
}

.atlas-root .explain-panel p {
  color: var(--soft);
  line-height: 1.7;
  margin: 0 0 12px;
}

.atlas-root .mini-card-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
}

/* ---------- Code block ---------- */
.atlas-root .code-block {
  overflow: hidden;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: #07090d;
}

.atlas-root .code-toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 9px 10px;
  border-bottom: 1px solid var(--border);
  background: #141b25c7;
  color: var(--muted);
}

.atlas-root .code-toolbar span,
.atlas-root .code-toolbar button {
  display: inline-flex;
  align-items: center;
  gap: 7px;
}

.atlas-root .code-toolbar button {
  border: 1px solid var(--border);
  background: #080a0f85;
  color: var(--soft);
  cursor: pointer;
  padding: 6px 9px;
  border-radius: 6px;
}

.atlas-root .code-toolbar button:hover {
  border-color: #22d3ee80;
  color: var(--text);
}

.atlas-root .code-block pre {
  max-height: 380px;
  margin: 0;
  overflow: auto;
  padding: 18px;
  color: #d8e4f1;
  font-size: 0.88rem;
  line-height: 1.65;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}

.atlas-root .code-block.compact pre {
  max-height: 220px;
}

/* ---------- Connect section ---------- */
.atlas-root .connect-band {
  width: min(1180px, calc(100% - 40px));
  margin: 72px auto 0;
  padding: 32px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: #0f141cc7;
  text-align: center;
}

.atlas-root .connect-band h2 {
  margin: 0 0 12px;
  font-size: 1.8rem;
}

.atlas-root .connect-band p {
  margin: 0 auto 24px;
  max-width: 640px;
  color: var(--soft);
  line-height: 1.7;
}

.atlas-root .connect-grid {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 12px;
}

.atlas-root .connect-link {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 10px 16px;
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--soft);
  font-size: 0.9rem;
  font-weight: 700;
  transition: border-color 0.16s ease, color 0.16s ease, transform 0.16s ease;
}

.atlas-root .connect-link:hover {
  border-color: #22d3ee94;
  color: var(--text);
  transform: translateY(-1px);
}

/* ---------- Star history ---------- */
.atlas-root .star-history-band {
  width: min(1180px, calc(100% - 40px));
  margin: 56px auto 0;
  text-align: center;
}

.atlas-root .star-history-band img {
  width: 80%;
  max-width: 800px;
  margin: 16px auto 0;
  border-radius: 8px;
}

/* ---------- Footer ---------- */
.atlas-root .footer-band {
  margin-top: 72px;
  padding: 32px 28px;
  border-top: 1px solid rgba(148, 163, 184, 0.16);
  background: #080a0fe0;
  text-align: center;
}

.atlas-root .footer-band p {
  color: var(--muted);
  font-size: 0.88rem;
  margin: 0;
}

.atlas-root .footer-band a {
  color: var(--cyan);
  font-weight: 700;
}

/* ---------- Responsive ---------- */
@media (max-width: 1060px) {
  .atlas-root .hero-grid,
  .atlas-root .split-section,
  .atlas-root .media-band,
  .atlas-root .detail-layout,
  .atlas-root .catalog-toolbar {
    grid-template-columns: 1fr;
  }
  .atlas-root .hero-grid {
    min-height: auto;
  }
  .atlas-root .detail-aside {
    position: static;
  }
  .atlas-root .card-grid,
  .atlas-root .usecase-grid,
  .atlas-root .category-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

@media (max-width: 760px) {
  .atlas-root .topbar {
    position: static;
    align-items: stretch;
    flex-direction: column;
    padding: 14px 18px;
  }
  .atlas-root .brand {
    min-width: 0;
  }
  .atlas-root .nav-links {
    justify-content: flex-start;
    overflow-x: auto;
    padding-bottom: 4px;
  }
  .atlas-root .icon-link {
    width: 100%;
  }
  .atlas-root .hero-grid,
  .atlas-root .page-hero,
  .atlas-root .content-band,
  .atlas-root .split-section,
  .atlas-root .media-band,
  .atlas-root .catalog-toolbar,
  .atlas-root .stat-strip,
  .atlas-root .detail-layout,
  .atlas-root .connect-band,
  .atlas-root .star-history-band {
    width: min(100% - 28px, 1180px);
  }
  .atlas-root .hero-copy h1,
  .atlas-root .page-hero h1 {
    font-size: 2.6rem;
  }
  .atlas-root .hero-copy p:not(.eyebrow),
  .atlas-root .page-hero p:not(.eyebrow) {
    font-size: 1rem;
  }
  .atlas-root .page-hero {
    grid-template-columns: 1fr;
  }
  .atlas-root .page-hero-icon {
    width: 82px;
    height: 82px;
  }
  .atlas-root .graph-stage {
    min-height: 410px;
  }
  .atlas-root .graph-node {
    min-width: 118px;
    padding: 9px 10px;
    font-size: 0.78rem;
  }
  .atlas-root .stat-strip,
  .atlas-root .card-grid,
  .atlas-root .usecase-grid,
  .atlas-root .category-grid,
  .atlas-root .mini-card-grid {
    grid-template-columns: 1fr;
  }
  .atlas-root .section-header {
    align-items: start;
    flex-direction: column;
  }
  .atlas-root .result-row {
    grid-template-columns: 10px minmax(0, 1fr);
  }
  .atlas-root .result-row small {
    grid-column: 2;
  }
  .atlas-root .connect-band {
    padding: 24px 18px;
  }
  .atlas-root .star-history-band img {
    width: 100%;
  }
}

@media (prefers-reduced-motion: reduce) {
  .atlas-root *,
  .atlas-root *::before,
  .atlas-root *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    scroll-behavior: auto !important;
    transition-duration: 0.001ms !important;
  }
}

/* Custom scrollbar for filter row */
.atlas-root .filter-row::-webkit-scrollbar {
  height: 6px;
}
.atlas-root .filter-row::-webkit-scrollbar-track {
  background: transparent;
}
.atlas-root .filter-row::-webkit-scrollbar-thumb {
  background: var(--border-strong);
  border-radius: 3px;
}

/* Code block scrollbar */
.atlas-root .code-block pre::-webkit-scrollbar {
  width: 8px;
  height: 8px;
}
.atlas-root .code-block pre::-webkit-scrollbar-track {
  background: #0b0f16;
}
.atlas-root .code-block pre::-webkit-scrollbar-thumb {
  background: #253041;
  border-radius: 4px;
}
.atlas-root .code-block pre::-webkit-scrollbar-thumb:hover {
  background: #334155;
}

/* ============================================================
   PREMIUM ENHANCEMENTS — refined glassmorphism, glow, gradients
   ============================================================ */

/* Premium font smoothing + rendering */
.atlas-root {
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
  font-feature-settings: "ss01", "cv11", "cv02";
}

/* Premium layered background with ambient glows */
.atlas-root {
  position: relative;
}

.atlas-root::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background:
    radial-gradient(ellipse 80% 50% at 15% 0%, rgba(34, 211, 238, 0.08), transparent 60%),
    radial-gradient(ellipse 70% 50% at 85% 20%, rgba(167, 139, 250, 0.06), transparent 55%),
    radial-gradient(ellipse 60% 50% at 50% 100%, rgba(52, 211, 153, 0.05), transparent 60%);
}

.atlas-root .app-shell {
  position: relative;
  z-index: 1;
}

/* ---------- Premium topbar ---------- */
.atlas-root .topbar {
  padding: 12px 28px;
  background: rgba(8, 10, 15, 0.72);
  border-bottom: 1px solid rgba(34, 211, 238, 0.12);
  box-shadow: 0 1px 0 rgba(34, 211, 238, 0.04), 0 12px 40px rgba(0, 0, 0, 0.35);
}

.atlas-root .brand-mark {
  background: linear-gradient(135deg, #0b1720 0%, #122030 100%);
  border-color: rgba(34, 211, 238, 0.5);
  box-shadow: 0 0 0 1px rgba(34, 211, 238, 0.1), 0 0 20px rgba(34, 211, 238, 0.18);
  transition: box-shadow 0.3s ease, transform 0.3s ease;
}

.atlas-root .brand:hover .brand-mark {
  box-shadow: 0 0 0 1px rgba(34, 211, 238, 0.2), 0 0 28px rgba(34, 211, 238, 0.35);
  transform: translateY(-1px);
}

.atlas-root .brand strong {
  font-weight: 700;
  letter-spacing: -0.01em;
}

/* ---------- Premium nav links ---------- */
.atlas-root .nav-links a {
  position: relative;
  font-weight: 600;
  letter-spacing: -0.005em;
}

.atlas-root .nav-links a::after {
  content: "";
  position: absolute;
  left: 12px;
  right: 12px;
  bottom: 4px;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--cyan), transparent);
  opacity: 0;
  transition: opacity 0.25s ease;
}

.atlas-root .nav-links a.active::after,
.atlas-root .nav-links a:hover::after {
  opacity: 0.7;
}

/* ---------- Premium hero headline ---------- */
.atlas-root .hero-copy h1,
.atlas-root .page-hero h1 {
  background: linear-gradient(180deg, #ffffff 0%, #d8e4f1 60%, #9aa7b8 100%);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  color: transparent;
  letter-spacing: -0.035em;
  font-weight: 800;
}

.atlas-root .eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 4px 10px;
  border: 1px solid rgba(52, 211, 153, 0.28);
  border-radius: 999px;
  background: rgba(52, 211, 153, 0.08);
  letter-spacing: 0.1em;
  font-size: 0.7rem;
}

.atlas-root .eyebrow::before {
  content: "";
  width: 6px;
  height: 6px;
  border-radius: 999px;
  background: var(--green);
  box-shadow: 0 0 10px var(--green);
  animation: pulse-dot 2.4s ease-in-out infinite;
}

@keyframes pulse-dot {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.55; transform: scale(0.85); }
}

/* ---------- Premium primary action button ---------- */
.atlas-root .primary-action {
  position: relative;
  background: linear-gradient(135deg, #f4f7fb 0%, #d8e4f1 100%);
  color: #081014;
  font-weight: 700;
  letter-spacing: -0.005em;
  box-shadow: 0 8px 24px rgba(244, 247, 251, 0.12), 0 0 0 1px rgba(244, 247, 251, 0.06);
  overflow: hidden;
}

.atlas-root .primary-action::before {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(120deg, transparent 30%, rgba(34, 211, 238, 0.35) 50%, transparent 70%);
  transform: translateX(-100%);
  transition: transform 0.7s ease;
}

.atlas-root .primary-action:hover {
  transform: translateY(-2px);
  box-shadow: 0 12px 32px rgba(244, 247, 251, 0.18), 0 0 0 1px rgba(34, 211, 238, 0.25);
}

.atlas-root .primary-action:hover::before {
  transform: translateX(100%);
}

.atlas-root .secondary-action {
  background: linear-gradient(135deg, rgba(15, 20, 28, 0.78) 0%, rgba(20, 27, 37, 0.78) 100%);
  border-color: rgba(34, 211, 238, 0.22);
  font-weight: 600;
}

.atlas-root .secondary-action:hover {
  border-color: rgba(34, 211, 238, 0.5);
  background: linear-gradient(135deg, rgba(20, 27, 37, 0.85) 0%, rgba(24, 33, 45, 0.85) 100%);
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3), 0 0 0 1px rgba(34, 211, 238, 0.15);
  transform: translateY(-2px);
}

/* ---------- Premium graph stage ---------- */
.atlas-root .graph-stage {
  border-color: rgba(34, 211, 238, 0.18);
  box-shadow: var(--shadow), inset 0 0 60px rgba(34, 211, 238, 0.04);
}

.atlas-root .graph-stage::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: radial-gradient(ellipse at 70% 30%, rgba(34, 211, 238, 0.08), transparent 50%);
  border-radius: 8px;
}

.atlas-root .graph-node {
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  background: rgba(8, 10, 15, 0.85);
  transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.25s ease, border-color 0.25s ease;
}

.atlas-root .graph-node:hover {
  transform: translate(-50%, -50%) scale(1.06);
  box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 0 1px currentColor, 0 0 30px currentColor;
}

.atlas-root .graph-console {
  background: rgba(8, 10, 15, 0.92);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-color: rgba(34, 211, 238, 0.22);
}

.atlas-root .graph-console strong {
  text-shadow: 0 0 16px rgba(52, 211, 153, 0.5);
}

/* ---------- Premium stat tiles ---------- */
.atlas-root .stat-tile {
  position: relative;
  background: linear-gradient(135deg, rgba(15, 20, 28, 0.9) 0%, rgba(20, 27, 37, 0.7) 100%);
  border-color: rgba(37, 48, 65, 0.8);
  overflow: hidden;
  transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
}

.atlas-root .stat-tile::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--cyan), transparent);
  opacity: 0.4;
}

.atlas-root .stat-tile:hover {
  transform: translateY(-3px);
  border-color: rgba(34, 211, 238, 0.4);
  box-shadow: 0 16px 40px rgba(0, 0, 0, 0.3), 0 0 0 1px rgba(34, 211, 238, 0.1);
}

.atlas-root .stat-tile strong {
  background: linear-gradient(180deg, #ffffff 0%, #c7d2e0 100%);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  font-weight: 800;
  letter-spacing: -0.02em;
}

.atlas-root .stat-tile svg {
  filter: drop-shadow(0 0 8px rgba(34, 211, 238, 0.4));
}

/* ---------- Premium cards ---------- */
.atlas-root .agent-card,
.atlas-root .usecase-card,
.atlas-root .category-card,
.atlas-root .framework-card {
  position: relative;
  background: linear-gradient(135deg, rgba(15, 20, 28, 0.9) 0%, rgba(20, 27, 37, 0.6) 100%);
  overflow: hidden;
  transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.3s ease, box-shadow 0.3s ease, background 0.3s ease;
}

.atlas-root .agent-card::before,
.atlas-root .usecase-card::before,
.atlas-root .category-card::before,
.atlas-root .framework-card::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--cyan), transparent);
  opacity: 0;
  transition: opacity 0.3s ease;
}

.atlas-root .agent-card::after,
.atlas-root .usecase-card::after,
.atlas-root .category-card::after,
.atlas-root .framework-card::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  padding: 1px;
  background: linear-gradient(135deg, rgba(34, 211, 238, 0.25), transparent 40%, transparent 60%, rgba(167, 139, 250, 0.15));
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor;
  mask-composite: exclude;
  opacity: 0;
  transition: opacity 0.3s ease;
  pointer-events: none;
}

.atlas-root .agent-card:hover,
.atlas-root .usecase-card:hover,
.atlas-root .category-card:hover,
.atlas-root .framework-card:hover {
  transform: translateY(-4px);
  border-color: rgba(34, 211, 238, 0.45);
  background: linear-gradient(135deg, rgba(20, 27, 37, 0.95) 0%, rgba(24, 33, 45, 0.75) 100%);
  box-shadow: 0 24px 48px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(34, 211, 238, 0.12);
}

.atlas-root .agent-card:hover::before,
.atlas-root .usecase-card:hover::before,
.atlas-root .category-card:hover::before,
.atlas-root .framework-card:hover::before {
  opacity: 1;
}

.atlas-root .agent-card:hover::after,
.atlas-root .usecase-card:hover::after,
.atlas-root .category-card:hover::after,
.atlas-root .framework-card:hover::after {
  opacity: 1;
}

    function icon(name, size) {
      size = size || 18;
      const svg = ICONS[name] || ICONS.Network;
      // Override width/height via regex
      return svg.replace(/width="\d+"/, 'width="' + size + '"').replace(/height="\d+"/, 'height="' + size + '"');
    }

    // ============================================================
    // Helpers
    // ============================================================
    function pathFor(route) { return '#' + route; }

    function getCategory(slug) {
      return CATEGORIES.find(c => c.slug === slug);
    }

    function getProject(id) {
      return PROJECTS.find(p => p.id === id);
    }

    function projectsByCategory(slug) {
      return PROJECTS.filter(p => p.category === slug);
    }

    function relatedProjects(project, limit) {
      limit = limit || 4;
      return PROJECTS.filter(p => p.id !== project.id && p.category === project.category).slice(0, limit);
    }

    function slugify(value) {
      return (value || 'item').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'item';
    }

    function normalize(value) {
      return (value || '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
    }

    function matchesQuery(item, query) {
      if (!query) return true;
      const haystack = normalize([item.title, item.description, item.category, (item.tags || []).join(' ')].join(' '));
      return normalize(query).split(' ').filter(Boolean).every(part => haystack.includes(part));
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
    }

    function deriveSteps(project) {
      const tags = project.tags.join(' ').toLowerCase();
      if (tags.includes('rag')) return ['Ingest', 'Embed', 'Retrieve', 'Generate', 'Respond'];
      if (tags.includes('llm') || tags.includes('agents') || tags.includes('genai')) return ['Prompt', 'Plan', 'Tool', 'Model', 'Output'];
      if (tags.includes('cv') || tags.includes('cnn') || tags.includes('mediapiipe')) return ['Capture', 'Preprocess', 'Detect', 'Postprocess', 'Render'];
      if (tags.includes('nlp') || tags.includes('classification')) return ['Tokenize', 'Embed', 'Classify', 'Decode', 'Output'];
      if (tags.includes('eda') || tags.includes('visualization')) return ['Load', 'Clean', 'Explore', 'Visualize', 'Report'];
      if (tags.includes('regression') || tags.includes('time-series')) return ['Gather', 'Engineer', 'Train', 'Evaluate', 'Deploy'];
      return ['Define', 'Gather', 'Build', 'Evaluate', 'Ship'];
    }

    function deriveFeatures(project) {
      const tags = project.tags.join(' ').toLowerCase();
      const features = [];
      if (tags.includes('production') || tags.includes('mlops')) features.push('Production-grade architecture with monitoring and deployment story');
      if (tags.includes('rag')) features.push('Retrieval-augmented generation with vector store and reranking');
      if (tags.includes('llm')) features.push('Large language model integration with prompt engineering');
      if (tags.includes('agents') || tags.includes('langgraph') || tags.includes('crewai')) features.push('Agentic workflow with tool use and multi-step reasoning');
      if (tags.includes('cnn') || tags.includes('cv') || tags.includes('mediapiipe')) features.push('Computer vision pipeline with real-time inference');
      if (tags.includes('nlp') || tags.includes('bert') || tags.includes('tf-idf')) features.push('NLP pipeline with tokenization, embeddings, and classification');
      if (tags.includes('bengali')) features.push('Bengali low-resource language support');
      if (tags.includes('eda') || tags.includes('visualization')) features.push('Exploratory data analysis with publication-ready visualizations');
      if (tags.includes('regression') || tags.includes('time-series')) features.push('Regression or time-series model with feature engineering');
      if (tags.includes('recsys') || tags.includes('collaborative')) features.push('Recommendation engine with similarity scoring');
      if (tags.includes('roadmap')) features.push('Structured learning roadmap with notes and reference implementations');
      if (tags.includes('from-scratch')) features.push('Pure-Python implementations — no library shortcuts');
      if (features.length === 0) {
        features.push('Self-contained project with README, code, and reproducible setup');
        features.push('Open source under permissive licensing on GitHub');
      }
      return Array.from(new Set(features)).slice(0, 6);
    }

    function renderCategoryCard(category, count) {
      return `
        <a class="category-card framework-card" href="${pathFor('/category/' + category.slug)}">
          <div class="card-topline">
            <span class="framework-pill ${category.accent}">${count} projects</span>
            <small><span class="mini-dot ${category.accent}" style="display:inline-block"></span></small>
          </div>
          <div class="category-icon-bubble tone-${category.accent}">
            ${icon(category.icon, 20)}
          </div>
          <strong>${escapeHtml(category.name)}</strong>
          <p>${escapeHtml(category.description)}</p>
          <div class="tag-list">
            <span class="framework-pill ${category.accent}">View projects</span>
          </div>
        </a>
      `;
    }

    // ============================================================
    // Render: Connect band
    // ============================================================
    function renderConnectBand() {
      const links = [
        { label: 'Website', href: REPO.author.website, icon: 'Link' },
        { label: 'Medium', href: REPO.author.medium, icon: 'BookOpen' },
        { label: 'LinkedIn', href: REPO.author.linkedin, icon: 'ExternalLink' },
        { label: 'Twitter', href: REPO.author.twitter, icon: 'Twitter' },
        { label: 'Kaggle', href: REPO.author.kaggle, icon: 'Trophy' },
        { label: 'LeetCode', href: REPO.author.leetcode, icon: 'Code2' },
      ];
      const linksHtml = links.map(l => `
        <a class="connect-link" href="${l.href}" target="_blank" rel="noreferrer">
          ${icon(l.icon, 16)} ${escapeHtml(l.label)}
        </a>
      `).join('');
      return `
        <section class="connect-band">
          <p class="eyebrow">Stay in touch</p>
          <h2>Connect with the author</h2>
          <p>
            Follow along as new AI, ML, and DL projects are added to the atlas. Whether you want to
            collaborate, ask a question, or just keep up with the latest releases, every channel below is open.
          </p>
          <div class="connect-grid">${linksHtml}</div>
        </section>
      `;
    }

    // ============================================================
    // Render: Page hero (sub-pages)
    // ============================================================
    function renderPageHero(eyebrow, title, description, iconName) {
      return `
        <section class="page-hero">
          <div>
            <p class="eyebrow">${escapeHtml(eyebrow)}</p>
            <h1>${escapeHtml(title)}</h1>
            <p>${escapeHtml(description)}</p>
          </div>
          <span class="page-hero-icon">${icon(iconName, 48)}</span>
        </section>
      `;
    }

    // ============================================================
    // Render: Code block (with copy button)
    // ============================================================
    function renderCodeBlock(code, compact) {
      const id = 'code-' + Math.random().toString(36).slice(2, 9);
      return `
        <div class="code-block${compact ? ' compact' : ''}" data-code-id="${id}">
          <div class="code-toolbar">
            <span>${icon('Code2', 14)} bash</span>
            <button onclick="copyCode('${id}')">${icon('Copy', 14)} <span class="copy-label">Copy</span></button>
          </div>
          <pre><code id="${id}">${escapeHtml(code)}</code></pre>
        </div>
      `;
    }

    function copyCode(id) {
      const el = document.getElementById(id);
      if (!el) return;
      const text = el.textContent;
      const btn = document.querySelector(`[data-code-id="${id}"] button`);
      const label = btn && btn.querySelector('.copy-label');
      if (navigator.clipboard) {
        navigator.clipboard.writeText(text).then(() => {
          if (label) { label.textContent = 'Copied'; setTimeout(() => label.textContent = 'Copy', 1500); }
        });
      } else {
        // fallback
        const ta = document.createElement('textarea');
        ta.value = text; document.body.appendChild(ta); ta.select();
        try { document.execCommand('copy'); if (label) { label.textContent = 'Copied'; setTimeout(() => label.textContent = 'Copy', 1500); } } catch(e) {}
        document.body.removeChild(ta);
      }
    }

    // ============================================================
    // Pages
    // ============================================================
    function renderHomePage() {
      const featuredProjects = PROJECTS.slice(0, 6);
      const featuredCategories = CATEGORIES.slice(0, 4);
      const productionProjects = projectsByCategory('production-ai');

      return `
        ${renderGraphHero()}
        ${renderStatStrip()}

        <section class="split-section">
          <div class="section-copy">
            <p class="eyebrow">Start here</p>
            <h2>Browse by category or jump straight to a project</h2>
            <p>
              The atlas is organized into ${CATEGORIES.length} categories — from foundational roadmaps and
              classical ML all the way to production-grade AI systems. Every project has its own detail page
              with metadata, tags, related projects, and a direct link to the source repository.
            </p>
            <a class="inline-action" href="${pathFor('/categories')}">Open categories ${icon('ArrowRight', 16)}</a>
          </div>
          <div class="category-grid">
            ${featuredCategories.map(c => renderCategoryCard(c, projectsByCategory(c.slug).length)).join('')}
          </div>
        </section>

        <section class="content-band">
          ${renderSectionHeader('Featured projects', 'A snapshot of the catalog', { label: 'View all projects', href: '/projects' })}
          <div class="card-grid">
            ${featuredProjects.map(p => renderProjectCard(p)).join('')}
          </div>
        </section>

        <section class="content-band">
          ${renderSectionHeader('Production AI systems', 'Battle-tested real-world deployments', { label: 'View production AI', href: '/category/production-ai' })}
          <div class="card-grid">
            ${productionProjects.map(p => renderProjectCard(p)).join('')}
          </div>
        </section>

        ${renderConnectBand()}
      `;
    }

    function renderCategoriesPage() {
      const cards = CATEGORIES.map(c => renderCategoryCard(c, projectsByCategory(c.slug).length)).join('');
      return `
        ${renderPageHero('Browse the catalog', 'Project categories',
          `The atlas spans ${CATEGORIES.length} categories covering foundations, prediction, NLP, vision, recommender systems, data analysis, tools, and production AI. Pick a category to dive into its projects.`,
          'Layers3')}
        <section class="content-band">
          <div class="category-grid">${cards}</div>
        </section>
      `;
    }

    function renderProjectsPage() {
      const filters = ['<button class="active" data-filter="all">All</button>']
        .concat(CATEGORIES.map(c => `<button data-filter="${c.slug}">${escapeHtml(c.name.split(' ')[0])}</button>`))
        .join('');

      const cards = PROJECTS.map(p => renderProjectCard(p)).join('');

      return `
        ${renderPageHero('Full catalog', 'All AI/ML/DL projects',
          'Search every project in the atlas by title, tag, or description. Filter by category to narrow the view, and click any card to open its detail page.',
          'Code2')}
        <section class="catalog-toolbar">
          <label class="search-box">
            ${icon('Search', 18)}
            <input id="search-input" type="text" placeholder="Search by title, tag, or description" aria-label="Search projects" />
          </label>
          <div class="filter-row" id="filter-row" role="tablist" aria-label="Filter by category">
            ${icon('Filter', 16)}
            ${filters}
          </div>
        </section>
        <section class="content-band">
          <div class="catalog-count" id="catalog-count">${PROJECTS.length} of ${PROJECTS.length} projects shown</div>
          <div class="card-grid" id="project-grid">${cards}</div>
        </section>
      `;
    }

    function renderCategoryPage(slug) {
      const category = getCategory(slug);
      if (!category) {
        return renderPageHero('404', 'Category not found',
          'The category you are looking for does not exist in the atlas.', 'Network');
      }
      const list = projectsByCategory(slug);
      const cards = list.map(p => renderProjectCard(p)).join('');
      return `
        ${renderPageHero('Category', category.name, category.description, category.icon)}
        <section class="content-band">
          <div class="catalog-count">${list.length} projects in this category</div>
          <div class="card-grid">${cards}</div>
        </section>
      `;
    }

    function renderConnectPage() {
      return `
        ${renderPageHero('Get in touch', 'Connect with Adil Shamim',
          'The atlas is maintained by Adil Shamim, an AI engineer with a decade of hands-on experience across research, industry, and open source. Reach out on any of the channels below.',
          'Network')}
        ${renderConnectBand()}
      `;
    }

    function renderProjectDetailPage(id) {
      const project = getProject(id);
      if (!project) {
        return renderPageHero('404', 'Project not found',
          'The project you are looking for is not in the atlas.', 'Network');
      }
      const category = getCategory(project.category);
      const related = relatedProjects(project, 3);
      const repoName = project.url.split('/').pop() || 'project';
      const runCommands = `# Clone the project\ngit clone ${project.url}\ncd ${repoName}\n\n# Follow the README for setup and usage instructions\n# Most projects use Python 3.10+ with a requirements.txt`;
      const steps = deriveSteps(project);
      const features = deriveFeatures(project);

      const metaRows = [
        ['Category', category ? category.name : '—'],
        ['Number', '#' + String(project.number).padStart(3, '0')],
        ['Tags', project.tags.join(', ')],
        ['Source', repoName],
        ['Author', REPO.author.name],
      ].map(([label, value]) => `
        <div class="meta-row">
          <span>${escapeHtml(label)}</span>
          <strong>${label === 'Source'
            ? `<a href="${project.url}" target="_blank" rel="noreferrer" style="color:var(--cyan)">${escapeHtml(value)}</a>`
            : escapeHtml(value)}</strong>
        </div>
      `).join('');

      const stepsHtml = steps.map((step, i) => `
        <div class="flow-step">
          <span>${i + 1}</span>
          <strong>${escapeHtml(step)}</strong>
        </div>
      `).join('');

      const featuresHtml = features.map(f => `
        <li>${icon('CheckCircle2', 16)} ${escapeHtml(f)}</li>
      `).join('');

      const tagsHtml = project.tags.map(t => `<span>${escapeHtml(t)}</span>`).join('');

      const relatedHtml = related.length > 0 ? `
        <section class="related-band">
          <h2>Related projects in ${category ? category.name : ''}</h2>
          <div class="mini-card-grid" style="margin-top:16px">
            ${related.map(p => renderProjectCard(p)).join('')}
          </div>
        </section>
      ` : '';

      return `
        ${renderPageHero(`${category ? category.name : 'Project'} · #${String(project.number).padStart(2, '0')}`,
          project.title, project.description, 'GitBranch')}
        <section class="detail-layout">
          <aside class="detail-aside">
            <section class="metadata-panel">
              <h2>Project metadata</h2>
              ${metaRows}
            </section>
            <h2>Quick start</h2>
            ${renderCodeBlock(runCommands, true)}
            <h2>Architecture flow</h2>
            <div class="flow-trace">${stepsHtml}</div>
          </aside>
          <article class="detail-main">
            <section class="explain-panel">
              <h2>How it works</h2>
              <p>${escapeHtml(project.description)}</p>
              <ul class="check-list">${featuresHtml}</ul>
            </section>
            <section class="explain-panel">
              <h2>Tags &amp; tech stack</h2>
              <p>This project is tagged with the following concepts. Click any tag to look for related projects across the atlas.</p>
              <div class="tag-list" style="margin-top:12px">${tagsHtml}</div>
            </section>
            <section class="explain-panel">
              <h2>Open the source repository</h2>
              <p>
                Every project in this atlas lives in its own GitHub repository under
                <a href="https://github.com/${REPO.owner}" target="_blank" rel="noreferrer" style="color:var(--cyan)">github.com/${REPO.owner}</a>.
                Use the button below to open the full source code, README, and setup instructions.
              </p>
              <div class="card-actions" style="margin-top:16px">
                <a href="${project.url}" target="_blank" rel="noreferrer">${icon('Github', 15)} View on GitHub</a>
                <a href="${project.url}" target="_blank" rel="noreferrer">${icon('ExternalLink', 15)} Open README</a>
              </div>
            </section>
            ${relatedHtml}
          </article>
        </section>
      `;
    }

    // ============================================================
    // Router
    // ============================================================
    function render() {
      const route = getRoute();
      let mainHtml;
      if (route.startsWith('/project/')) {
        mainHtml = renderProjectDetailPage(route.slice('/project/'.length));
      } else if (route.startsWith('/category/')) {
        mainHtml = renderCategoryPage(route.slice('/category/'.length));
      } else if (route === '/categories') {
        mainHtml = renderCategoriesPage();
      } else if (route === '/projects') {
        mainHtml = renderProjectsPage();
      } else if (route === '/connect') {
        mainHtml = renderConnectPage();
      } else {
        mainHtml = renderHomePage();
      }
      document.getElementById('app').innerHTML = renderShell(route, mainHtml);

      // Attach interactivity for the projects page
      if (route === '/projects') {
        attachProjectsPageInteractivity();
      }

      // Re-render scroll progress + back-to-top
      attachScrollProgress();

      // Scroll to top on route change
      window.scrollTo(0, 0);
    }

    // ============================================================
    // Projects page interactivity (search + filter)
    // ============================================================
    let searchState = { query: '', filter: 'all' };

    function attachProjectsPageInteractivity() {
      const input = document.getElementById('search-input');
      const filterRow = document.getElementById('filter-row');
      const grid = document.getElementById('project-grid');
      const countEl = document.getElementById('catalog-count');

      function updateGrid() {
        const filtered = PROJECTS.filter(p =>
          matchesQuery(p, searchState.query) &&
          (searchState.filter === 'all' || p.category === searchState.filter)
        );
        grid.innerHTML = filtered.map(p => renderProjectCard(p)).join('');
        countEl.textContent = filtered.length + ' of ' + PROJECTS.length + ' projects shown';
        if (filtered.length === 0) {
          grid.innerHTML = '<div class="catalog-count" style="grid-column:1/-1;text-align:center;padding:40px 0">No projects match your search. Try a different keyword or clear the filter.</div>';
        }
      }

      if (input) {
        input.addEventListener('input', (e) => { searchState.query = e.target.value; updateGrid(); });
      }

      if (filterRow) {
        filterRow.querySelectorAll('button').forEach(btn => {
          btn.addEventListener('click', () => {
            filterRow.querySelectorAll('button').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            searchState.filter = btn.dataset.filter;
            updateGrid();
          });
        });
      }
    }

    // ============================================================
    // Scroll progress + back-to-top
    // ============================================================
    function attachScrollProgress() {
      let bar = document.querySelector('.scroll-progress');
      if (!bar) {
        bar = document.createElement('div');
        bar.className = 'scroll-progress';
        bar.setAttribute('aria-hidden', 'true');
        document.body.appendChild(bar);
      }
      let btn = document.querySelector('.back-to-top');
      // remove old button if present (we'll re-add on scroll if needed)

      function onScroll() {
        const scrollTop = window.scrollY;
        const docHeight = document.documentElement.scrollHeight - window.innerHeight;
        const pct = docHeight > 0 ? Math.min(100, (scrollTop / docHeight) * 100) : 0;
        bar.style.width = pct + '%';

        if (scrollTop > 600) {
          if (!btn) {
            btn = document.createElement('button');
            btn.className = 'back-to-top';
            btn.setAttribute('aria-label', 'Back to top');
            btn.setAttribute('title', 'Back to top');
            btn.innerHTML = icon('ArrowUpRight', 20);
            btn.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
            document.body.appendChild(btn);
          }
        } else if (btn) {
          btn.remove();
          btn = null;
        }
      }
      window.addEventListener('scroll', onScroll, { passive: true });
      onScroll();
    }

    // ============================================================
    // Init
    // ============================================================
    window.addEventListener('hashchange', render);
    window.addEventListener('DOMContentLoaded', render);
    // Fallback in case DOMContentLoaded already fired
    if (document.readyState !== 'loading') render();
  </script>
